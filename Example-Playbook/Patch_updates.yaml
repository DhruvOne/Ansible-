- name: Apply OS updates across dev EC2 fleet
  hosts: env_dev
  become: true
  gather_facts: true
  tasks:

    - name: Update apt cache and upgrade packages (Debian/Ubuntu)
      apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
      register: apt_result

    - name: Update all packages (RedHat/CentOS)
      yum:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"
      register: yum_result

    - name: Check if reboot is required (Debian/Ubuntu)
      stat:
        path: /var/run/reboot-required
      register: reboot_required
      when: ansible_os_family == "Debian"

    - name: Flag hosts that need a reboot
      debug:
        msg: "⚠️  {{ inventory_hostname }} needs a reboot after updates"
      when:
        - ansible_os_family == "Debian"
        - reboot_required.stat.exists
